<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      font-family: "Noto Sans CJK TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #faf9f6;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* Subtle background pattern */
    body::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 25%, #c45d3e0a 0%, transparent 50%),
        radial-gradient(circle at 85% 75%, #c45d3e06 0%, transparent 50%);
    }

    .card {
      position: relative; z-index: 1;
      width: 1080px; height: 510px;
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e8e4de;
      box-shadow: 0 4px 30px rgba(0,0,0,0.06);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem 4rem;
      text-align: center;
    }

    .accent-bar {
      width: 60px; height: 4px;
      background: #c45d3e;
      border-radius: 2px;
      margin-bottom: 2.2rem;
    }

    .title {
      font-family: Georgia, "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
      font-size: 4rem;
      font-weight: 700;
      color: #2c2c2c;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.55rem;
      color: #7a7a7a;
      font-weight: 400;
      line-height: 1.6;
      max-width: 700px;
    }

    .topics {
      display: flex;
      gap: 1rem;
      margin-top: 2.2rem;
    }

    .topic {
      background: #c45d3e10;
      border: 1px solid #c45d3e30;
      color: #c45d3e;
      padding: 0.45rem 1.2rem;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .author {
      position: absolute;
      bottom: 2rem; right: 3rem;
      font-size: 0.9rem;
      color: #b0aba3;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent-bar"></div>
    <div class="title">從零開始認識 AI</div>
    <div class="subtitle">LLM、Agent、以及怎麼跟他們合作</div>
    <div class="topics">
      <span class="topic">LLM 核心機制</span>
      <span class="topic">Agent 架構</span>
      <span class="topic">實戰應用</span>
    </div>
    <div class="author">Hoss Huang</div>
  </div>
</body>
</html>
